<!DOCTYPE html>
<!-- Variables: tenantName, requesterName, requesterEmail, currentPlan, requestedPlan, message (optional) -->
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<div th:replace="~{email/base-styles :: layout(~{::content})}">
    <th:block th:fragment="content">
        <h1 style="color:#111827; font-size:22px; margin:0 0 16px;" th:text="#{email.plan_upgrade_request.title}">Solicitud de upgrade</h1>
        <p style="color:#374151; font-size:15px; line-height:1.6; margin:0 0 8px;"
           th:text="#{email.plan_upgrade_request.body(${tenantName}, ${requesterName}, ${requesterEmail}, ${currentPlan}, ${requestedPlan})}">
            Un usuario solicitó un upgrade de plan.</p>
        <p th:if="${message}" style="color:#374151; font-size:15px; line-height:1.6; margin:0 0 8px;"
           th:text="#{email.plan_upgrade_request.message_label(${message})}">Mensaje del usuario.</p>
    </th:block>
</div>
</body>
</html>
