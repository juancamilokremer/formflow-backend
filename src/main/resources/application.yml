spring:
  application:
    name: formflow-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  # SMTP: Mailpit en dev (sin auth), SendGrid en prod via variables de entorno
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}

  # JPA
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        # No explicit dialect: Hibernate picks it from the JDBC connection (PostgreSQLDialect in
        # prod/dev, H2Dialect under the test profile). Forcing PostgreSQLDialect made Hibernate
        # match H2's version against PostgreSQL's minimum and log a bogus HHH000511 warning.
        format_sql: true

  # Flyway
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  # Default is 1MB — too low for branding logos (2MB, backend#7) and already too low for
  # some 'file'-type question answers (#158). 5MB covers both with headroom.
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

# Logging — el MDC (requestId, tenantId, userId) lo puebla RequestLoggingFilter + JwtAuthenticationFilter
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{requestId:-}] [t:%X{tenantId:-}] [u:%X{userId:-}] %logger{36} : %msg%n"

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI / Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Rate limiting — Bucket4j servlet filter intercepta antes de Spring MVC.
# Ajustar capacity/time por perfil si es necesario.
# Deshabilitar en entornos de prueba con RATE_LIMIT_ENABLED=false.
bucket4j:
  enabled: ${RATE_LIMIT_ENABLED:true}
  # RateLimitCacheConfig provides the javax.cache.CacheManager (Caffeine's JCache provider,
  # in-memory) this starter version requires — see backend#165.
  cache-to-use: jcache
  # Off by default only when the property is absent (its own matchIfMissing=true), not when
  # actually unset in the properties object — needs a second, separate cache ("filterConfigCache")
  # we never created. We don't need runtime-reconfigurable limits, so disable it explicitly.
  filter-config-caching-enabled: false
  filters:
    - cache-name: rate-limit-buckets
      url: /api/v1/public/forms/[^/]+/responses
      strategy: first
      http-content-type: "application/json;charset=UTF-8"
      http-response-body: '{"success":false,"message":"Has enviado demasiadas respuestas. Espera un momento e inténtalo de nuevo"}'
      rate-limits:
        - execute-condition: "method.equals('POST')"
          cache-key: "(getHeader('X-Forwarded-For') ?: remoteAddr).split(',')[0].trim()"
          bandwidths:
            - capacity: 10
              time: 1
              unit: minutes
              refill-speed: interval

# Configuración de la aplicación
app:
  jwt:
    secret: ${JWT_SECRET:cambiar-esto-en-produccion-usar-variable-de-entorno}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}       # 24 horas
    refresh-expiration-ms: ${JWT_REFRESH_MS:604800000} # 7 días
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:4200}
  mail:
    from: ${MAIL_FROM:no-reply@formflow.app}
    from-name: ${MAIL_FROM_NAME:FormFlow}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  # Documentación de usuario, enlazada desde el email de bienvenida (backend#8) —
  # placeholder hasta que exista documentación real.
  docs-url: ${DOCS_URL:https://docs.formflow.app/placeholder}
  # Executor del envío asíncrono de correos (AsyncConfig)
  async:
    email:
      core-pool-size: ${EMAIL_POOL_CORE:2}
      max-pool-size: ${EMAIL_POOL_MAX:4}
      queue-capacity: ${EMAIL_QUEUE_CAPACITY:100}
  pagination:
    default-page: ${PAGINATION_DEFAULT_PAGE:0}
    default-size: ${PAGINATION_DEFAULT_SIZE:20}
  # Generic file storage (shared/storage/FileStoragePort) — used by answers to 'file'-type
  # questions (backend#158) and, eventually, tenant branding logos (backend#7). Local
  # filesystem for the single-instance MVP, no external credentials needed. Migrating to
  # Cloudflare R2 later only means a new FileStoragePort adapter, no changes to any caller.
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
