<!DOCTYPE html>
<!-- Variables: tenantName, roleLabel, acceptUrl, expirationHours -->
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<body>
<div th:replace="~{email/base-styles :: layout(~{::content})}">
    <th:block th:fragment="content">
        <h1 style="color:#111827; font-size:22px; margin:0 0 16px;" th:text="#{email.user_invitation.title}">Tienes una invitación</h1>
        <p style="color:#374151; font-size:15px; line-height:1.6; margin:0 0 24px;"
           th:text="#{email.user_invitation.body(${tenantName}, ${roleLabel})}">Te invitaron a unirte.</p>
        <a th:href="${acceptUrl}"
           style="display:inline-block; background-color:#3B82F6; color:#ffffff; text-decoration:none;
                  padding:12px 28px; border-radius:6px; font-size:15px; font-weight:bold;"
           th:text="#{email.user_invitation.cta}">Aceptar invitación</a>
        <p style="color:#6b7280; font-size:13px; line-height:1.6; margin:24px 0 0;"
           th:text="#{email.user_invitation.expiration(${expirationHours})}">El enlace expira pronto.</p>
    </th:block>
</div>
</body>
</html>
